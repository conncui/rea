name: Sync upstream

on:
  schedule:
    # GitHub Actions cron uses UTC. Trigger at both possible UTC hours, then
    # verify the Los Angeles local hour to account for daylight saving time.
    - cron: "0 16,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: automation/sync-upstream
      UPSTREAM_REPOSITORY: morluto/rea
    steps:
      - name: Check scheduled time
        id: schedule
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ "$(TZ=America/Los_Angeles date +%H)" == "09" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC schedule outside 9:00 AM America/Los_Angeles."
          fi

      - name: Check out main
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        if: steps.schedule.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin main
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains every upstream main commit."
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH" origin/main
          git merge --no-ff --no-edit upstream/main

          remote_sha="$(git ls-remote origin "refs/heads/${SYNC_BRANCH}" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$remote_sha" ]]; then
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}" \
              "--force-with-lease=refs/heads/${SYNC_BRANCH}:${remote_sha}"
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

          echo "up_to_date=false" >> "$GITHUB_OUTPUT"

      - name: Create or reuse synchronization pull request
        id: pull-request
        if: steps.schedule.outputs.should_run == 'true' && steps.sync.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" \
            --base main --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main \
              --title "chore: sync upstream morluto/rea" \
              --body "Automated synchronization from \`morluto/rea\` branch \`main\`." \
              --json number --jq '.number')"
          fi
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub CLI did not return a valid pull request number: ${pr_number@Q}"
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge synchronization pull request
        if: steps.schedule.outputs.should_run == 'true' && steps.sync.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch; then
            echo "::error::Unable to merge synchronization PR #${PR_NUMBER}. Branch protection or required checks may prevent immediate merging."
            exit 1
          fi
